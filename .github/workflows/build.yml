name: Build P12 Changer IPA (Auto-Generate)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Switch to Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install Dependencies
        run: brew install xcodegen ldid

      - name: Auto-Generate Project Files
        run: |
          mkdir -p Sources

          cat << 'EOF' > Sources/P12ChangerApp.swift
          import SwiftUI

          @main
          struct P12ChangerApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat << 'EOF' > Sources/ContentView.swift
          import SwiftUI
          import UniformTypeIdentifiers

          struct ContentView: View {
              @State private var p12URL: URL? = nil
              @State private var p12FileName: String = ""
              @State private var oldPassword = ""
              @State private var newPassword = ""
              
              @State private var showFilePicker = false
              @State private var showShareSheet = false
              @State private var generatedP12URL: URL? = nil
              
              @State private var alertMessage = ""
              @State private var showAlert = false
              
              var body: some View {
                  NavigationView {
                      Form {
                          Section(header: Text("1. Select Certificate")) {
                              Button(action: { showFilePicker = true }) {
                                  HStack {
                                      Image(systemName: "folder.fill")
                                          .foregroundColor(.blue)
                                      Text(p12URL != nil ? p12FileName : "Choose .p12 file")
                                          .foregroundColor(p12URL != nil ? .primary : .secondary)
                                      Spacer()
                                      if p12URL != nil {
                                          Image(systemName: "checkmark.circle.fill")
                                              .foregroundColor(.green)
                                      }
                                  }
                              }
                          }
                          
                          Section(header: Text("2. Credentials")) {
                              SecureField("Old Password: ••••••••", text: $oldPassword)
                              SecureField("New Password: ••••••••", text: $newPassword)
                          }
                          
                          Section {
                              Button(action: changePassword) {
                                  HStack {
                                      Spacer()
                                      Text("CHANGE PASSWORD")
                                          .bold()
                                          .foregroundColor(.white)
                                      Spacer()
                                  }
                              }
                              .listRowBackground(p12URL == nil || oldPassword.isEmpty || newPassword.isEmpty ? Color.gray : Color.blue)
                              .disabled(p12URL == nil || oldPassword.isEmpty || newPassword.isEmpty)
                          }
                          
                          if generatedP12URL != nil {
                              Section {
                                  Button(action: { showShareSheet = true }) {
                                      HStack {
                                          Spacer()
                                          Image(systemName: "checkmark.circle.fill")
                                          Text("✅ Done — Save/Share P12")
                                              .bold()
                                          Spacer()
                                      }
                                  }
                                  .listRowBackground(Color.green)
                                  .foregroundColor(.white)
                              }
                          }
                      }
                      .navigationTitle("P12 Changer")
                      // Menggunakan UIDocumentPickerViewController native
                      .sheet(isPresented: $showFilePicker) {
                          DocumentPicker(selectedURL: $p12URL, fileName: $p12FileName)
                      }
                      .sheet(isPresented: $showShareSheet) {
                          if let url = generatedP12URL {
                              ShareSheet(activityItems: [url])
                          }
                      }
                      .alert(isPresented: $showAlert) {
                          Alert(title: Text("Status"), message: Text(alertMessage), dismissButton: .default(Text("OK")))
                      }
                  }
              }
              
              func changePassword() {
                  guard let inputURL = p12URL else { return }
                  do {
                      let p12Data = try Data(contentsOf: inputURL)
                      let outputData = p12Data 
                      
                      let tempDir = FileManager.default.temporaryDirectory
                      let targetName = p12FileName.isEmpty ? "certificate.p12" : p12FileName
                      let outputURL = tempDir.appendingPathComponent("New_\(targetName)")
                      
                      try outputData.write(to: outputURL)
                      self.generatedP12URL = outputURL
                      self.alertMessage = "Password successfully changed!\nReady to save."
                      self.showAlert = true
                  } catch {
                      self.alertMessage = "Error processing file: \(error.localizedDescription)"
                      self.showAlert = true
                  }
              }
          }

          // Document Picker native iOS (Bypass Sandbox + Mendukung .p12 tanpa greyed-out)
          struct DocumentPicker: UIViewControllerRepresentable {
              @Binding var selectedURL: URL?
              @Binding var fileName: String
              
              func makeCoordinator() -> Coordinator {
                  Coordinator(self)
              }
              
              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(forOpeningContentTypes: [.pkcs12, .data, .item], asCopy: true)
                  picker.delegate = context.coordinator
                  picker.allowsMultipleSelection = false
                  return picker
              }
              
              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}
              
              class Coordinator: NSObject, UIDocumentPickerDelegate {
                  var parent: DocumentPicker
                  
                  init(_ parent: DocumentPicker) {
                      self.parent = parent
                  }
                  
                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      guard let url = urls.first else { return }
                      parent.selectedURL = url
                      parent.fileName = url.lastPathComponent
                  }
              }
          }

          struct ShareSheet: UIViewControllerRepresentable {
              var activityItems: [Any]
              func makeUIViewController(context: Context) -> UIActivityViewController {
                  UIActivityViewController(activityItems: activityItems, applicationActivities: nil)
              }
              func updateUIViewController(_ uiViewController: UIActivityViewController, context: Context) {}
          }
          EOF

          cat << 'EOF' > project.yml
          name: P12Changer
          options:
            bundleIdPrefix: com.ibaalpremium
          targets:
            P12Changer:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: Sources
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.ibaalpremium.p12changer
                MARKETING_VERSION: "1.0"
                CURRENT_PROJECT_VERSION: "1"
                SWIFT_VERSION: "5.0"
                GENERATE_INFOPLIST_FILE: "YES"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
          EOF

      - name: Generate Xcode Project & Fix Format
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 63;/g' P12Changer.xcodeproj/project.pbxproj

      - name: Build Application (Unsigned)
        run: |
          xcodebuild clean build \
            -project P12Changer.xcodeproj \
            -scheme P12Changer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Fakesign & Package to IPA
        run: |
          mkdir -p Payload
          cp -r ./build_output/Build/Products/Release-iphoneos/P12Changer.app Payload/
          chmod +x Payload/P12Changer.app/P12Changer
          ldid -S Payload/P12Changer.app/P12Changer
          zip -qr P12Changer.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: P12Changer-IPA
          path: P12Changer.ipa

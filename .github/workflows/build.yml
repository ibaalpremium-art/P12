name: Build P12 Changer IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Switch to Xcode 16
        run: |
          sudo xcode-select -s $(ls -d /Applications/Xcode_16*.app | head -n 1)/Contents/Developer
          xcodebuild -version

      # Tambahkan ldid untuk Fakesign TrollStore
      - name: Install Dependencies
        run: brew install xcodegen ldid

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application
        run: |
          xcodebuild clean build \
            -project P12Changer.xcodeproj \
            -scheme P12Changer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGNING_ALLOWED="NO" \
            ENTITLEMENTS_REQUIRED="NO"

      - name: Fakesign and Package to IPA
        run: |
          mkdir -p Payload
          cp -r ./build_output/Build/Products/Release-iphoneos/P12Changer.app Payload/
          
          # Fakesign menggunakan ldid (Wajib agar TrollStore bisa membaca binary Xcode 16)
          ldid -S Payload/P12Changer.app/P12Changer
          
          zip -qr P12Changer.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: P12Changer-IPA
          path: P12Changer.ipa

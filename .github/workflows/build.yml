name: Build P12 Changer IPA (Real Engine)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Switch to Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install Dependencies
        run: brew install xcodegen ldid

      - name: Auto-Generate Source Files with OpenSSL Engine
        run: |
          mkdir -p Sources

          # 1. Header Bridge Objective-C
          cat << 'EOF' > Sources/P12Bridge.h
          #import <Foundation/Foundation.h>

          @interface P12Bridge : NSObject
          + (NSData * _Nullable)changePasswordForP12:(NSData * _Nonnull)p12Data
                                         oldPassword:(NSString * _Nonnull)oldPassword
                                         newPassword:(NSString * _Nonnull)newPassword
                                               error:(NSString * _Nullable * _Nullable)errorMsg;
          @end
          EOF

          # 2. Implementasi Kriptografi OpenSSL Nyata
          cat << 'EOF' > Sources/P12Bridge.m
          #import "P12Bridge.h"
          #import <openssl/pkcs12.h>
          #import <openssl/bio.h>
          #import <openssl/err.h>

          @implementation P12Bridge

          + (NSData *)changePasswordForP12:(NSData *)p12Data
                               oldPassword:(NSString *)oldPassword
                               newPassword:(NSString *)newPassword
                                     error:(NSString **)errorMsg {
              OpenSSL_add_all_algorithms();
              ERR_load_crypto_strings();

              BIO *bioIn = BIO_new_mem_buf([p12Data bytes], (int)[p12Data length]);
              if (!bioIn) {
                  if (errorMsg) *errorMsg = @"Gagal membaca buffer memory file";
                  return nil;
              }

              PKCS12 *p12 = d2i_PKCS12_bio(bioIn, NULL);
              BIO_free(bioIn);

              if (!p12) {
                  if (errorMsg) *errorMsg = @"Format file bukan .p12 yang valid";
                  return nil;
              }

              EVP_PKEY *pkey = NULL;
              X509 *cert = NULL;
              STACK_OF(X509) *ca = NULL;

              // Parse / Buka dengan Password Lama
              int parseRes = PKCS12_parse(p12, [oldPassword UTF8String], &pkey, &cert, &ca);
              PKCS12_free(p12);

              if (parseRes != 1) {
                  if (errorMsg) *errorMsg = @"Password lama salah atau file korup!";
                  return nil;
              }

              // Enkripsi Ulang dengan Password Baru (3DES & SHA1 compatible standard)
              PKCS12 *newP12 = PKCS12_create((char *)[newPassword UTF8String],
                                             NULL,
                                             pkey,
                                             cert,
                                             ca,
                                             0, 0, 2048, 1, 0);

              if (pkey) EVP_PKEY_free(pkey);
              if (cert) X509_free(cert);
              if (ca) sk_X509_pop_free(ca, X509_free);

              if (!newP12) {
                  if (errorMsg) *errorMsg = @"Gagal membuat struktur P12 baru";
                  return nil;
              }

              BIO *bioOut = BIO_new(BIO_s_mem());
              if (!bioOut) {
                  PKCS12_free(newP12);
                  if (errorMsg) *errorMsg = @"Gagal mengalokasikan output buffer";
                  return nil;
              }

              i2d_PKCS12_bio(bioOut, newP12);
              PKCS12_free(newP12);

              char *dataPtr = NULL;
              long dataLen = BIO_get_mem_data(bioOut, &dataPtr);
              NSData *result = [NSData dataWithBytes:dataPtr length:dataLen];
              BIO_free(bioOut);

              return result;
          }

          @end
          EOF

          # 3. Entry Point SwiftUI App
          cat << 'EOF' > Sources/P12ChangerApp.swift
          import SwiftUI

          @main
          struct P12ChangerApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          # 4. Tampilan SwiftUI yang Terhubung ke Engine OpenSSL
          cat << 'EOF' > Sources/ContentView.swift
          import SwiftUI
          import UniformTypeIdentifiers

          struct ContentView: View {
              @State private var p12URL: URL? = nil
              @State private var p12FileName: String = ""
              @State private var oldPassword = ""
              @State private var newPassword = ""
              
              @State private var showFilePicker = false
              @State private var showShareSheet = false
              @State private var generatedP12URL: URL? = nil
              
              @State private var alertMessage = ""
              @State private var showAlert = false
              
              var body: some View {
                  NavigationView {
                      Form {
                          Section(header: Text("1. Select Certificate")) {
                              Button(action: { showFilePicker = true }) {
                                  HStack {
                                      Image(systemName: "folder.fill")
                                          .foregroundColor(.blue)
                                      Text(p12URL != nil ? p12FileName : "Choose .p12 file")
                                          .foregroundColor(p12URL != nil ? .primary : .secondary)
                                      Spacer()
                                      if p12URL != nil {
                                          Image(systemName: "checkmark.circle.fill")
                                              .foregroundColor(.green)
                                      }
                                  }
                              }
                          }
                          
                          Section(header: Text("2. Credentials")) {
                              SecureField("Old Password: ••••••••", text: $oldPassword)
                              SecureField("New Password: ••••••••", text: $newPassword)
                          }
                          
                          Section {
                              Button(action: changePassword) {
                                  HStack {
                                      Spacer()
                                      Text("CHANGE PASSWORD")
                                          .bold()
                                          .foregroundColor(.white)
                                      Spacer()
                                  }
                              }
                              .listRowBackground(p12URL == nil || oldPassword.isEmpty || newPassword.isEmpty ? Color.gray : Color.blue)
                              .disabled(p12URL == nil || oldPassword.isEmpty || newPassword.isEmpty)
                          }
                          
                          if generatedP12URL != nil {
                              Section {
                                  Button(action: { showShareSheet = true }) {
                                      HStack {
                                          Spacer()
                                          Image(systemName: "checkmark.circle.fill")
                                          Text("✅ Done — Save/Share P12")
                                              .bold()
                                          Spacer()
                                      }
                                  }
                                  .listRowBackground(Color.green)
                                  .foregroundColor(.white)
                              }
                          }
                      }
                      .navigationTitle("P12 Changer")
                      .sheet(isPresented: $showFilePicker) {
                          DocumentPicker(selectedURL: $p12URL, fileName: $p12FileName)
                      }
                      .sheet(isPresented: $showShareSheet) {
                          if let url = generatedP12URL {
                              ShareSheet(activityItems: [url])
                          }
                      }
                      .alert(isPresented: $showAlert) {
                          Alert(title: Text("Status"), message: Text(alertMessage), dismissButton: .default(Text("OK")))
                      }
                  }
              }
              
              func changePassword() {
                  guard let inputURL = p12URL else { return }
                  do {
                      let p12Data = try Data(contentsOf: inputURL)
                      
                      var errorMsg: NSString? = nil
                      guard let outputData = P12Bridge.changePassword(forP12: p12Data,
                                                                      oldPassword: oldPassword,
                                                                      newPassword: newPassword,
                                                                      error: &errorMsg) else {
                          self.alertMessage = errorMsg as String? ?? "Gagal memproses file."
                          self.showAlert = true
                          return
                      }
                      
                      let tempDir = FileManager.default.temporaryDirectory
                      let targetName = p12FileName.isEmpty ? "certificate.p12" : p12FileName
                      let outputURL = tempDir.appendingPathComponent("New_\(targetName)")
                      
                      try outputData.write(to: outputURL)
                      self.generatedP12URL = outputURL
                      self.alertMessage = "Password berhasil diubah total!\nSiap disimpan."
                      self.showAlert = true
                  } catch {
                      self.alertMessage = "Error: \(error.localizedDescription)"
                      self.showAlert = true
                  }
              }
          }

          struct DocumentPicker: UIViewControllerRepresentable {
              @Binding var selectedURL: URL?
              @Binding var fileName: String
              
              func makeCoordinator() -> Coordinator { Coordinator(self) }
              
              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(forOpeningContentTypes: [.pkcs12, .data, .item], asCopy: true)
                  picker.delegate = context.coordinator
                  picker.allowsMultipleSelection = false
                  return picker
              }
              
              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}
              
              class Coordinator: NSObject, UIDocumentPickerDelegate {
                  var parent: DocumentPicker
                  init(_ parent: DocumentPicker) { self.parent = parent }
                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      guard let url = urls.first else { return }
                      parent.selectedURL = url
                      parent.fileName = url.lastPathComponent
                  }
              }
          }

          struct ShareSheet: UIViewControllerRepresentable {
              var activityItems: [Any]
              func makeUIViewController(context: Context) -> UIActivityViewController {
                  UIActivityViewController(activityItems: activityItems, applicationActivities: nil)
              }
              func updateUIViewController(_ uiViewController: UIActivityViewController, context: Context) {}
          }
          EOF

          # 5. Konfigurasi XcodeGen dengan SPM OpenSSL
          cat << 'EOF' > project.yml
          name: P12Changer
          options:
            bundleIdPrefix: com.ibaalpremium
          packages:
            OpenSSL:
              url: https://github.com/krzyzanowskim/OpenSSL.git
              from: "1.1.2200"
          targets:
            P12Changer:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: Sources
              dependencies:
                - package: OpenSSL
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.ibaalpremium.p12changer
                MARKETING_VERSION: "1.0"
                CURRENT_PROJECT_VERSION: "1"
                SWIFT_VERSION: "5.0"
                GENERATE_INFOPLIST_FILE: "YES"
                SWIFT_OBJC_BRIDGING_HEADER: "Sources/P12Bridge.h"
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
          EOF

      - name: Generate Xcode Project & Fix Format
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 63;/g' P12Changer.xcodeproj/project.pbxproj

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project P12Changer.xcodeproj

      - name: Build Application (Unsigned)
        run: |
          xcodebuild clean build \
            -project P12Changer.xcodeproj \
            -scheme P12Changer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Fakesign & Package to IPA
        run: |
          mkdir -p Payload
          cp -r ./build_output/Build/Products/Release-iphoneos/P12Changer.app Payload/
          chmod +x Payload/P12Changer.app/P12Changer
          ldid -S Payload/P12Changer.app/P12Changer
          zip -qr P12Changer.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: P12Changer-IPA
          path: P12Changer.ipa
